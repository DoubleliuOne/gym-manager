server:
  port: 8080

spring:
  profiles:
    # 本地开发默认加载 application-local.yml（已在 .gitignore 中忽略），
    # 真实口令与密钥放在那里，不要提交到仓库。
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=public}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:gaussdb}
    password: ${DB_PASSWORD:}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: AUTO
  type-aliases-package: com.gym.*.entity

jwt:
  secret: ${JWT_SECRET:please-set-jwt-secret-in-application-local-yml}
  expiration: 86400000
